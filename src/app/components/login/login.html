<div class="login-container">
  <!-- Left Side - Login Form -->
  <div class="login-left">
    <div class="login-card">
      <div class="card-header">
        <h1>Log in</h1>
        <p>Sign in with your email and password</p>
      </div>

      <div class="role-selector">
        <button type="button" [class.active]="selectedRole === 'Admin'" (click)="setRole('Admin')">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
          </svg>
          Admin
        </button>
        <button type="button" [class.active]="selectedRole === 'User'" (click)="setRole('User')">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          User
        </button>
      </div>

      <form class="login-form" (ngSubmit)="onSubmit()">
        <div class="error-alert" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <div class="form-group">
          <label for="email">Email / Phone</label>
          <input type="text" id="email" [(ngModel)]="email" name="email" placeholder="7732370237" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="••••••••••"
            required />
        </div>

        <div class="form-options">
          <label class="checkbox-wrapper">
            <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" />
            <span class="checkbox-custom"></span>
            <span class="checkbox-label">Remember me for 30 days</span>
          </label>
        </div>

        <button type="submit" class="btn-verify" [disabled]="isLoading">
          {{ isLoading ? 'Signing in...' : 'Log in' }}
        </button>
      </form>

      <div class="card-footer">
        <p>Don't have an account? <a href="#" class="contact-link">Contact Admin</a></p>
      </div>
    </div>
  </div>

  <!-- Right Side - Branding & Illustration -->
  <div class="login-right">
    <div class="right-header">
      <div class="logo-brand">
        <img src="assets/images/chitcloud-logo.svg" height="50" alt="ChitCloud" />
      </div>
      <a href="#" class="visit-website">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />
        </svg>
        Visit Website
      </a>
    </div>

    <div class="login-right-container">
      <img src="assets/images/celebration-illustration.svg" alt="Login Illustration" class="login-illustration" />
    </div>

    <div class="right-content">
      <h2 class="tagline">Your Chit Fund. Automated. Organized. Stress-Free.</h2>
      <p class="description">From member onboarding to auctions and collections, streamline every step with real-time
        accuracy</p>
    </div>
  </div>
</div>
